<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1e21">
<title>اتصال اینترنت برقرار نیست</title>
<link rel="stylesheet" href="/assets/fonts/vazirmatn/vazirmatn.css">
<style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Vazirmatn, Tahoma, sans-serif; background: #0e1e21; color: #fff; text-align: center; }
    .box { max-width: 420px; }
    img { width: 96px; margin: 0 auto 24px; display: block; animation: float 3s ease-in-out infinite; }
    h1 { font-size: 26px; margin: 0 0 10px; }
    p { color: #97a3a7; line-height: 2; margin: 0 0 28px; }
    button { height: 56px; padding: 0 34px; border: 0; border-radius: 16px; background: #fbb12e; color: #173038; font: inherit; font-weight: 800; cursor: pointer; }
    @keyframes float { 50% { transform: translateY(-10px); } }
</style>
</head>
<body>
<div class="box">
    <img src="/assets/img/logo-mark.svg" alt="">
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>به نظر می‌رسد آفلاین هستید. صفحاتی که قبلا مشاهده کرده‌اید همچنان در دسترس هستند؛ برای مشاهده محتوای جدید، اتصال خود را بررسی کنید.</p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
</div>
</body>
</html>
